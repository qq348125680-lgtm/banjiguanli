name: V7 React build and preview smoke (no deployment)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [test/v7-build-verification]
permissions:
  contents: read
concurrency:
  group: v7-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_ENABLE_WORKFLOW_WRITES: 'false'
      VITE_SUPABASE_URL: 'https://YOUR_PROJECT.supabase.co'
      VITE_SUPABASE_PUBLISHABLE_KEY: 'YOUR_PUBLIC_PUBLISHABLE_KEY'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Install exact declared dependency versions
        run: npm install --no-audit --no-fund
      - name: Unit tests and source preflight
        run: |
          npm test
          npm run verify:source
          npm run preflight:offline
      - name: TypeScript and Vite production build
        run: npm run build
      - name: Verify build assets exist and contain no placeholder or elevated key markers
        run: |
          test -s dist/index.html
          npm run verify:dist
      - name: HTTP smoke test of Vite production preview
        run: npm run smoke:preview
      - name: Upload build outputs and dependency lock for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-build-review
          path: |
            dist/
            package-lock.json
          if-no-files-found: warn
          retention-days: 7
